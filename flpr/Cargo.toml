[package]
name = "flpr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "flpr"
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-riscv32", "executor-thread"] }
nrf-pac = { version = "0.4", features = ["nrf54lm20a-flpr"] }
riscv = { version = "0.16", features = ["critical-section-single-hart"] }
riscv-rt = { version = "0.18", features = ["single-hart", "custom-interrupts"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
critical-section = "1"

[profile.dev]
debug = 2
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
